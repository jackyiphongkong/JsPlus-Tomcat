# https://tomcat.apache.org/tomcat-11.0-doc/config/http.html
Version=2025.07.05
port=${TOMCAT_PORT}
sslPort=${TOMCAT_SSL_PORT}
maxPostSize=209715200
maxSavePostSize=209715200
connectionTimeout=300000
keepAliveTimeout=300000
maxThreads=1000
reloadable=true

Webapp.contextPath[0]=/
Webapp.appBase[0]=${JS_PLUS_PATH}/webapps/trade/

Webapp.contextPath[1]=/default_a
Webapp.appBase[1]=${JS_PLUS_PATH}/webapps/trade/

Webapp.contextPath[2]=/default_b
Webapp.appBase[2]=${JS_PLUS_PATH}/webapps/trade/

Webapp.contextPath[3]=/default_c
Webapp.appBase[3]=${JS_PLUS_PATH}/webapps/trade/

WebLog.Enable=true
WebLog.Folder=${JS_PLUS_PATH}/../logs/domain
WebLog.ArchiveDays=
WebLog.ParamMaxLength=
# WebLog.Type=
# WebLog.Ignored=
# WebLog.Allowed=

SSL.enable=true
SSL.keyRoot=${JS_PLUS_PATH}/key/
SSL.keystoreFile[0]=default_keystore.jks
SSL.keystorePass[0]=changeit
SSL.keyAlias[0]=client

SSL.truststoreFile=default_truststore.jks
SSL.truststorePass=changeit
SSL.truststoreType=JKS

# HTTP/2: h2 over TLS (sslPort, negotiated via ALPN — JSSE on JDK 9+) and
# h2c via HTTP/1.1 Upgrade on the plain connector (port).
Http2.enable=true
Http2.maxConcurrentStreams=200

TomcatScriptConsole.poolSize=100
TomcatScriptConsole.cacheSeconds=2
TomcatScriptConsole.freedDelayMs=10
TomcatScriptConsole.engineName=graalvm.js

errorRedirectEnable=false
errorRedirectUrl=https://error.domain.com/%s.html


SecurityFilter.cacheSeconds=0

# IpFilter: master switch; rules are stored per domain:port in domain_ip_rule (one row per rule).
# A row with domain=0 and port=0 acts as a server-wide fallback
# (applied to every domain that has no rules of its own), like SecurityFilter.
# Pattern formats: exact IP (192.168.1.10), CIDR (192.168.1.0/24), wildcard (192.168.1.*).
IpFilter.enable=true
IpFilter.cacheSeconds=0

# IpAttackDefense: per-IP request logging + automatic attack defense.
# Requests are recorded to ip_request_log in batches (CacheArray + CacheDriverExecutor).
# Defense rules live in ip_defense_rule (matched by domain:port; "0","0" = server-wide;
# a non-blank uri_pattern additionally matches the request URI by regex);
# when an IP exceeds a rule's threshold it is auto-banned into domain_ip_rule (DENY)
# and tracked in ip_ban until the ban expires.
IpAttackDefense.enable=true
IpAttackDefense.logTimer=5000
IpAttackDefense.ruleCacheSeconds=0
# ip_request_log retention: soft-delete rows older than logRetention,
# then physically delete rows soft-deleted more than logPhysicalDelete ago (0 = disabled).
# Time format: ms|s|m|h|d|w (e.g. 3600s, 7d).
IpAttackDefense.logRetention=1h
IpAttackDefense.logPhysicalDelete=2h

DomainProxy.enable=true
DomainProxy.proxyConnectTimeout=60s
DomainProxy.proxyRequestTimeout=30s


